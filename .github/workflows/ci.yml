name: Pipeline de Integracao Continua (CI)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-e-teste:
    name: Compilar e Testar Aplicacao Spring Boot
    runs-on: ubuntu-latest

    # 🟢 ADICIONADO: Subir uma instância do MongoDB para os testes se conectarem
    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017

    steps:
    - name: Baixar o código fonte
      uses: actions/checkout@v4

    - name: Configurar o JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    - name: Dar permissao de execucao ao Maven Wrapper
      run: chmod +x mvnw

    - name: Compilar e Rodar Testes com Maven
      run: ./mvnw clean package
