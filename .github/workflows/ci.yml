name: Pipeline de Integracao Continua (CI)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-e-teste:
    name: Compilar e Testar Aplicacao Spring Boot
    runs-on: ubuntu-latest

    steps:
    - name: Baixar o código fonte
      uses: actions/checkout@v4

    - name: Configurar o JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    - name: Dar permissao de execucao ao Maven Wrapper
      run: chmod +x mvnw

    - name: Compilar e Rodar Testes com Maven
      run: ./mvnw clean package
