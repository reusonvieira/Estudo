name: Pipeline de Integracao Continua (CI)

# Define o que vai disparar (dar o play) nessa automação
on:
  push:
    branches: [ "main", "master" ] # Roda sempre que você der 'git push' nessas branches
  pull_request:
    branches: [ "main", "master" ] # Roda sempre que você abrir um Pull Request

jobs:
  build-e-teste:
    name: Compilar e Testar Aplicacao Spring Boot
    runs-on: ubuntu-latest # O GitHub vai disponibilizar uma máquina Linux virtual gratuita para rodar seu código

    steps:
    # Passo 1: Copia o código do seu repositório do GitHub para dentro da máquina virtual
    - name: Baixar o código fonte
      uses: actions/checkout@v4

    # Passo 2: Instala o Java na máquina do GitHub
    - name: Configurar o JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin' # Distribuição padrão amplamente usada no mercado
        cache: 'maven'         # Salva as dependências baixadas para o próximo build ser mais rápido

    # Passo 3: Dá permissão de execução para o utilitário do Maven (evita erros de permissão no Linux)
    - name: Dar permissao de execucao ao Maven Wrapper
      run: chmod +x mvnw

    # Passo 4: Executa a compilação do projeto e roda os testes
    - name: Compilar e Rodar Testes com Maven
      run: ./mvnw clean package
